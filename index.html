<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Hello World — @f6qa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800;900&family=JetBrains+Mono:wght@500;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <canvas id="sparkle-canvas"></canvas>
  <div class="bg-gradient-mesh" aria-hidden="true"></div>
  <div class="bg-noise" aria-hidden="true"></div>

  <main class="center-container">

    <div class="bounce-wrapper" id="bounce-box" title="Cliquez pour faire rebondir !">
      <div class="minimal-pill">
        <span class="status-dot"></span>
        <span>f6qa.cloud</span>
      </div>

      <h1 class="gradient-headline">
        Hello world from <span class="highlight-text">f6qa!</span>
      </h1>

      <div class="bounce-shadow"></div>
    </div>

    <footer class="minimal-footer">
      <span class="mono-badge">Allo Selem ?</span>
      <div class="social-links">
        <a href="https://github.com/f6qa" target="_blank" rel="noopener" class="social-item">GitHub</a>
        <span class="divider">•</span>
        <span class="social-item copy-item" data-copy="@f6qa" title="Copier le Discord">Discord: @f6qa</span>
      </div>
    </footer>

  </main>

  <div class="toast-box" id="toast">Copié !</div>
  <script src="app.js"></script>
</body>

</html>
